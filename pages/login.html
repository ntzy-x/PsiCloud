<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PsiCloud</title> 
  <link rel="stylesheet" href="../css/style.css"> <!--alteração do link (guilherme)-->
</head>
<body class="auth-body">

  <main class="auth-container">
    <div class="auth-card">
      
      <!-- Cabeçalho do Card -->
      <header class="auth-header">
        <h1 class="logo-title">PsiCloud</h1>
        <p class="auth-subtitle">Acesse sua conta institucional</p>
      </header>

      <!-- Formulário com Validação Nativa HTML5 -->
      <form action="dashboard-psicologo.html" method="GET" class="auth-form">
        
        <div class="form-group">
          <label for="email">E-mail Institucional</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="input-field" 
            placeholder="aluno@aluno.ifpi.edu.br" 
            required 
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input 
            type="password" 
            id="senha" 
            name="senha" 
            class="input-field" 
            placeholder="••••••••" 
            required 
            minlength="6" 
            autocomplete="current-password"
          />
        </div>

        <button type="submit" class="btn-primary">Entrar no PsiCloud</button>
      </form>

      <!-- Links de Navegação -->
      <footer class="auth-footer">
        <p>Ainda não tem conta? <a href="cadastro.html">Cadastre-se aqui</a></p>
        <p><a href="index.html" class="link-back">← Voltar para a página inicial</a></p>
      </footer>

    </div>
  </main>

</body>
</html>
